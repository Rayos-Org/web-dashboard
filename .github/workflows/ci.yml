name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
        
    - name: Install dependencies
      run: pnpm install
      
    - name: Typecheck
      run: pnpm tsc --noEmit
      
    - name: Lint
      run: pnpm lint
      
    - name: Component Tests
      run: pnpm test --run
      
    - name: Install Playwright Browsers
      run: pnpm exec playwright install --with-deps
      
    - name: Run E2E Tests
      run: pnpm test:e2e

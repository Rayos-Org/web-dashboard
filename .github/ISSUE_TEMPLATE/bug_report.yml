---
name: 🐛 Bug Report
description: Report a reproducible bug or regression
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form completely so we can reproduce and fix it quickly.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Before submitting, please confirm all of the following
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest version from `main`
          required: true
        - label: I have read the [CONTRIBUTING guide](../docs/CONTRIBUTING.md)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear, concise description of what the bug is
      placeholder: "When I click 'Send', the QuickSend dialog closes without submitting the transaction..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps needed to reproduce the behaviour
      placeholder: |
        1. Navigate to `/wallet`
        2. Click the **Send** button on the BalanceCard
        3. Enter recipient address and amount
        4. Click **Continue** → Approve passkey prompt
        5. See error: "..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: The transaction should be submitted and the tx hash shown.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: The dialog closes and no transaction is submitted.
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Affected URL / Route
      placeholder: "https://rayos-stellar-frontend.vercel.app/wallet"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and any relevant extension info
      placeholder: |
        - OS: macOS 15.1
        - Browser: Chrome 126
        - Node: 22.x
        - pnpm: 9.x

  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Messages
      description: Paste any relevant console errors or network responses
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, screen recordings, or anything else that helps
